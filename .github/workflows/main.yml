name: Release Automation (FCM & RTDB)

on:
  release:
    types: [published]

jobs:
  deploy-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Google Cloud ile Güvenli Kimlik Doğrulama
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}'
          token_format: 'access_token'

      # 2. Değişkenleri Hazırla
      # sed ile tag başındaki tüm harfler temizlenir: Beta18.6 → 18.6
      - name: Prepare Variables
        id: vars
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION=$(echo "$TAG_NAME" | sed 's/^[^0-9]*//')
          BASE_URL="https://github.com/nwanes/repo-for-oto-lin-go/releases/download/${TAG_NAME}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "url_stable=${BASE_URL}/otolingo${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "url_beta=${BASE_URL}/otolingo${VERSION}-beta.apk" >> $GITHUB_OUTPUT

      # Debug — üretilen linkleri logda görmek için
      - name: Debug URLs
        run: |
          echo "url_stable: ${{ steps.vars.outputs.url_stable }}"
          echo "url_beta:   ${{ steps.vars.outputs.url_beta }}"

      # 3. Firebase RTDB Güncelleme — SADECE stabil sürümlerde
      - name: Update Firebase RTDB
        if: ${{ github.event.release.prerelease == false }}
        run: |
          RTDB_URL="https://${{ secrets.FIREBASE_PROJECT_ID }}-default-rtdb.firebaseio.com/app_config.json"
          curl -X PATCH "$RTDB_URL?access_token=${{ steps.auth.outputs.access_token }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"latest_version_code\": \"${{ steps.vars.outputs.tag }}\",
            \"github_link\": \"${{ steps.vars.outputs.url_stable }}\"
          }"

      # 4a. FCM — Stabil: "all" topiğine
      - name: Send FCM Message (all topic — stable release)
        if: ${{ github.event.release.prerelease == false }}
        run: |
          curl -X POST "https://fcm.googleapis.com/v1/projects/${{ secrets.FIREBASE_PROJECT_ID }}/messages:send" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"message\": {
              \"topic\": \"all\",
              \"data\": {
                \"title\": \"Önemli Güncelleme\",
                \"body\": \"Güncellemek için tıklayınız\",
                \"url\": \"${{ steps.vars.outputs.url_stable }}\"
              }
            }
          }"

      # 4b. FCM — Pre-release: "beta" topiğine
      - name: Send FCM Message (beta topic — pre-release)
        if: ${{ github.event.release.prerelease == true }}
        run: |
          curl -X POST "https://fcm.googleapis.com/v1/projects/${{ secrets.FIREBASE_PROJECT_ID }}/messages:send" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"message\": {
              \"topic\": \"beta\",
              \"data\": {
                \"title\": \"Yeni Beta Sürümü Yayında\",
                \"body\": \"Yeni beta sürümü yayında! İndirmek için tıklayınız.\",
                \"url\": \"${{ steps.vars.outputs.url_beta }}\"
              }
            }
          }"
