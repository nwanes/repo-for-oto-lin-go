name: Release Automation (FCM & RTDB)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'APK tag adı (örn: 18.0 veya Beta18.6)'
        required: true
        type: string
      is_prerelease:
        description: 'Pre-release mi? (beta topicine gider, RTDB güncellenmez)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}'
          token_format: 'access_token'

      - name: Prepare Variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            IS_PRERELEASE="${{ github.event.inputs.is_prerelease }}"
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
            IS_PRERELEASE="${{ github.event.release.prerelease }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "url=https://github.com/nwanes/repo-for-oto-lin-go/releases/download/${TAG_NAME}/otolingo${TAG_NAME}.apk" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      # 3. Firebase RTDB Güncelleme — HATA KONTROLÜ EKLENDİ
     - name: Update Firebase RTDB
    if: steps.vars.outputs.is_prerelease == 'false'
    run: |
      RTDB_URL="${{ secrets.FIREBASE_RTDB_URL }}/app_config.json"
      RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH "${RTDB_URL}?access_token=${{ steps.auth.outputs.access_token }}" \
      -H "Content-Type: application/json" \
      -d "{
        \"latest_version_code\": \"${{ steps.vars.outputs.tag }}\",
        \"github_link\": \"${{ steps.vars.outputs.url }}\"
      }")
      
      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
      BODY=$(echo "$RESPONSE" | head -n-1)
      
      echo "RTDB Response: $BODY"
      echo "HTTP Status: $HTTP_CODE"
      
      if [[ "$HTTP_CODE" != "200" ]]; then
        echo "❌ RTDB güncelleme başarısız! HTTP Status: $HTTP_CODE"
        exit 1
      fi
      echo "✅ RTDB başarıyla güncellendi"

      # 4a. FCM — Stabil: "all" topiğine (HATA KONTROLÜ EKLENDİ)
      - name: Send FCM Message (all topic — stable release)
        if: steps.vars.outputs.is_prerelease == 'false'
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://fcm.googleapis.com/v1/projects/${{ secrets.FIREBASE_PROJECT_ID }}/messages:send" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"message\": {
              \"topic\": \"all\",
              \"data\": {
                \"title\": \"Önemli Güncelleme\",
                \"body\": \"Güncellemek için tıklayınız\",
                \"url\": \"${{ steps.vars.outputs.url }}\"
              }
            }
          }")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "FCM Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"
          
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "❌ FCM bildirimi gönderilemedi! HTTP Status: $HTTP_CODE"
            exit 1
          fi
          echo "✅ FCM bildirimi başarıyla gönderildi"

      # 4b. FCM — Pre-release: "beta" topiğine
      - name: Send FCM Message (beta topic — pre-release)
        if: steps.vars.outputs.is_prerelease == 'true'
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://fcm.googleapis.com/v1/projects/${{ secrets.FIREBASE_PROJECT_ID }}/messages:send" \
          -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"message\": {
              \"topic\": \"beta\",
              \"data\": {
                \"title\": \"Yeni Beta Sürümü Yayında\",
                \"body\": \"Yeni beta sürümü yayında! İndirmek için tıklayınız.\",
                \"url\": \"${{ steps.vars.outputs.url }}\"
              }
            }
          }")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "FCM Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"
          
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "❌ FCM Beta bildirimi gönderilemedi! HTTP Status: $HTTP_CODE"
            exit 1
          fi
          echo "✅ FCM Beta bildirimi başarıyla gönderildi"

      # 5. README.md Güncelleme
      - name: Update README.md with new APK link
        if: steps.vars.outputs.is_prerelease == 'false'
        run: |
          sed -i 's|https://github.com/nwanes/repo-for-oto-lin-go/releases/download/[^/]*/otolingo[^)]*\.apk|${{ steps.vars.outputs.url }}|g' README.md
          
          if git diff --quiet README.md; then
            echo "⚠️ README.md dosyasında değişiklik yapılacak bir şey bulunamadı"
          else
            echo "✅ README.md güncellendi:"
            git diff README.md
          fi

      # 6. Git Commit ve Push
      - name: Commit and push README update
        if: steps.vars.outputs.is_prerelease == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          
          if git diff --cached --quiet; then
            echo "⚠️ Commit edilecek değişiklik yok"
          else
            git commit -m "chore: update APK download link to ${{ steps.vars.outputs.tag }}"
            git push origin HEAD:${{ github.ref }}
            echo "✅ Değişiklikler başarıyla push edildi"
          fi
